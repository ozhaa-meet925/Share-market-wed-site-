name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run backend test suite
        run: npm test
      - name: Verify audit chain
        run: node -e "import('./serverCoreAudit.js').then((m) => { const r = m.verifyAudit(); console.log(JSON.stringify(r)); if (!r.ok) process.exit(1); })"

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
          du -sh dist
      - name: Bundle size gate (informational)
        run: |
          node -e "const fs=require('fs');const files=fs.readdirSync('dist/assets').filter(f=>f.endsWith('.js'));const total=files.reduce((n,f)=>n+fs.statSync('dist/assets/'+f).size,0);console.log('total JS bytes:',total);if(total>3_000_000){console.error('JS bundle exceeded 3 MB');process.exit(1);}"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed env files or live credentials
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo 'A .env file is tracked. Remove it and rotate any exposed keys.' >&2
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const path = require("path");
            const names = ["UPSTOX_CLIENT_SECRET", "ZERODHA_API_SECRET", "BROKER_TOKEN_KEY", "RAZORPAY_KEY_SECRET", "KUN_DATA_API_TOKEN"];
            const skip = new Set(["node_modules", "dist", ".git", "_archive"]);
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              if (skip.has(entry.name)) return [];
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
            let bad = false;
            for (const file of walk(".")) {
              if (!/\.(js|jsx|json|ya?ml)$/.test(file)) continue;
              const text = fs.readFileSync(file, "utf8");
              for (const name of names) {
                const re = new RegExp(name + "\\s*[:=]\\s*[\"\\x27]([A-Za-z0-9_\\-]{12,})[\"\\x27]");
                if (re.test(text)) {
                  console.error("Hard-coded credential " + name + " in " + file);
                  bad = true;
                }
              }
            }
            if (bad) process.exit(1);
          '

  gate:
    name: Deployment gate
    runs-on: ubuntu-latest
    needs: [test, build, secret-scan]
    steps:
      - run: echo "Tests, build and secret scan passed. Deployment may proceed."
